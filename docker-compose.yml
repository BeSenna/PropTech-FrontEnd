# Sobe o frontend (Next.js, porta 7520):
#   docker compose up -d --build
# Sem segredos: o frontend não usa Infisical. As variáveis NEXT_PUBLIC_* vêm do ambiente (no servidor, do Jenkinsfile)
# e são gravadas no build. Ex. com o subcaminho de produção:  NEXT_PUBLIC_BASE_PATH=/condominio docker compose up -d --build
services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/condominio/gateway/morador}
        NEXT_PUBLIC_FINANCEIRO_API_URL: ${NEXT_PUBLIC_FINANCEIRO_API_URL:-/condominio/gateway/financeiro}
    container_name: proptech-frontend
    restart: unless-stopped
    ports:
      - "7520:7520"
